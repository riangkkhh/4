.tabs{display:flex;gap:6px;margin:6px 0 14px}.tabs button{flex:1;padding:8px;border-radius:10px;background:var(--bub);font-weight:700;font-size:13px;color:var(--mu)}.tabs button.on{background:var(--ac);color:#fff}
.hb{position:relative}

<header>

el.innerHTML=`<div class="pcard"><div class="phd"><span class="pib">${ic("chart")}</span><span>סקר</span><span class="pm${p.closed?" cl":""}">${p.closed?"הסקר נסגר":p.multi?"אפשר לבחור כמה תשובות":"בחירה אחת"}</span></div><div class="pq">${esc(p.q)}</div>${p.opts.map((o,i)=>{const pc=tot?Math.min(100,Math.round(o.n/tot*100)):0,mine=p.mine.includes(i);return `<button class="po${mine?" mine":""}" data-i="${i}"${p.closed?" disabled":""}><span class="pf" style="width:${pc}%"></span><span class="pc${p.multi?" sq":""}">${mine?ic("check"):""}</span><span class="pt">${esc(o.t)}</span><span class="pp">${pc}% · ${o.n}</span></button>`}).join("")}<div class="pft"><span>${tot} ${tot===1?"משתתף":"משתתפים"}</span>${!S.me&&!p.closed?"<span>· התחברו כדי להצביע</span>":""}${S.admin&&!p.closed?`<button class="btn2 d pcls">סגירת הסקר</button>`:""}</div></div>`;
el.querySelectorAll(".po").forEach(b=>b.onclick=()=>votePoll(m,+b.dataset.i,el));
const c=el.querySelector(".pcls");if(c)c.onclick=async()=>{if(!confirm("לסגור את הסקר? לא יהיה אפשר להצביע יותר."))return;const x=await api("/api/poll/close","POST",{id:p.id});if(x.ok)reload();else toast("שגיאה")}}
async function votePoll(m,i,el){const p=m.poll;if(!S.me)return loginM("התחברו כדי להצביע");if(p.closed||el._busy)return;el._busy=true;
try{const sel=p.multi?(p.mine.includes(i)?p.mine.filter(v=>v!==i):[...p.mine,i]):(p.mine.includes(i)?[]:[i]);
const x=await api("/api/poll/vote","POST",{poll_id:p.id,opts:sel});
if(x.ok&&x.j.poll){m.poll=x.j.poll;fillPoll(el,m)}else toast(x.j.error==="closed"?"הסקר נסגר":"שגיאה בהצבעה")}finally{el._busy=false}}
function openPollMaker(){if(!S.admin)return;const opts=["",""];
mdl(`<button class="x" id="xx">✕</button><h3>סקר חדש</h3><input id="pq" placeholder="השאלה" maxlength="200" style="direction:rtl"><div id="pls"></div><button class="btn2 g" id="pad" type="button" style="margin:0 0 12px">+ הוספת אפשרות</button><label class="chk"><input type="checkbox" id="pm"> אפשר לבחור כמה תשובות</label><select id="pw" style="width:100%;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--inp);color:var(--tx);font:inherit;margin-bottom:12px"><option value="charlie">פרסום בשם: שיר חדש</option><option value="skull">פרסום בשם: סקופ בלעדי - עדכוני מערכת</option></select><button class="gb" id="psd">פרסום הסקר</button>`,"460px");
$("pw").value=$("who").value;
const draw=()=>{$("pls").innerHTML=opts.map((v,i)=>`<div class="porow"><input class="pi" data-i="${i}" placeholder="אפשרות ${i+1}" maxlength="80" value="${esc(v)}" style="direction:rtl">${opts.length>2?`<button class="px" data-i="${i}" type="button" title="הסרה">${ic("x")}</button>`:""}</div>`).join("");
$("pls").querySelectorAll(".pi").forEach(e=>e.oninput=()=>{opts[+e.dataset.i]=e.value});
$("pls").querySelectorAll(".px").forEach(b=>b.onclick=()=>{opts.splice(+b.dataset.i,1);draw()});$("pad").style.display=opts.length>=10?"none":""};
draw();$("pad").onclick=()=>{if(opts.length<10){opts.push("");draw();const l=$("pls").querySelectorAll(".pi");l[l.length-1].focus()}};
$("psd").onclick=async()=>{const q=$("pq").value.trim(),o=opts.map(v=>v.trim()).filter(Boolean);if(!q)return toast("כתוב שאלה");if(new Set(o.map(v=>v.toLowerCase())).size<2)return toast("צריך לפחות שתי אפשרויות שונות");
$("psd").disabled=true;const x=await api("/api/poll","POST",{q,opts:o,multi:$("pm").checked,who:$("pw").value});$("psd").disabled=false;
if(x.ok){closeM();await reload();scrollTo(0,document.body.scrollHeight)}else toast(x.j.error==="forbidden"?"רק המנהל הראשי יכול לשלוח סקר":"שגיאה ביצירת הסקר")}}
$("pl").onclick=openPollMaker;
$("bp").onclick=()=>mdl(POLICY,"560px");$("bu").onclick=openSubmit;$("br").onclick=openReports;$("bk").onclick=openBlocks;$("bi").onclick=openSubs;
head();load(true);setInterval(poll,8000);
addEventListener("load",gsi);
</script></body></html>
